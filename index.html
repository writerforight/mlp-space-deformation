<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neural Space Deformation</title>
<meta name="description" content="Interactive visualization of how a small MLP deforms space, layer by layer, and how backpropagation reshapes it. Plain JavaScript, no ML libraries.">
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2128; --line: #30363d; --text: #e6edf3;
    --muted: #8b949e; --accent: #58a6ff; --accent2: #1f6feb; --good: #3fb950; --bad: #f85149; --warn: #d29922;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 650; letter-spacing: 0.01em; }
  header .spacer { flex: 1; }
  #app {
    display: grid; grid-template-columns: 300px minmax(0, 1fr) 330px;
    height: calc(100vh - 47px); min-height: 560px;
  }
  aside { overflow-y: auto; background: var(--panel); padding: 4px 12px 16px; scrollbar-color: #30363d var(--panel); scrollbar-width: thin; }
  aside::-webkit-scrollbar { width: 8px; } aside::-webkit-scrollbar-track { background: var(--panel); }
  aside::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
  #controls { border-right: 1px solid var(--line); }
  #analysis { border-left: 1px solid var(--line); }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #view { position: relative; flex: 1; min-height: 300px; }
  #c2d, #c3d { position: absolute; inset: 0; width: 100%; height: 100%; }
  #c2d { touch-action: none; }
  #c3d canvas { display: block; touch-action: none; }
  #toolbar {
    position: absolute; top: 10px; left: 10px; display: flex; gap: 4px; flex-wrap: wrap; max-width: calc(100% - 20px);
    background: rgba(22, 27, 34, 0.88); border: 1px solid var(--line); border-radius: 8px; padding: 4px;
  }
  #stageLabel {
    position: absolute; top: 10px; right: 12px; text-align: right; pointer-events: none;
    background: rgba(13, 17, 23, 0.7); padding: 4px 8px; border-radius: 6px;
  }
  #stageLabel b { font-size: 14px; }
  #legend {
    position: absolute; bottom: 30px; left: 12px; right: 12px; max-width: 640px; pointer-events: none;
    background: rgba(13, 17, 23, 0.78); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font-size: 12px;
  }
  #hint { position: absolute; bottom: 8px; left: 12px; color: var(--muted); pointer-events: none; font-size: 12px; }
  #stagebar {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line); background: var(--panel);
  }
  #stagebar input[type=range] { flex: 1; }
  #ticks { font-size: 11px; color: var(--muted); min-width: 90px; text-align: right; }

  h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
    margin: 16px 0 8px; padding-top: 10px; border-top: 1px solid var(--line); font-weight: 600;
  }
  aside h2:first-child { border-top: none; padding-top: 4px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .row > label:first-child { width: 96px; flex: none; color: var(--muted); }
  .row input[type=range] { flex: 1; min-width: 60px; }
  .row .val { width: 48px; text-align: right; font-variant-numeric: tabular-nums; color: var(--text); }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; margin: 6px 0; }
  .checks label { display: flex; align-items: center; gap: 6px; }
  select, input[type=number], input[type=text] {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    padding: 3px 6px; font: inherit; min-width: 0;
  }
  input[type=number] { width: 64px; }
  select { flex: 1; }
  input[type=range] { accent-color: var(--accent); }
  input[type=checkbox], input[type=radio] { accent-color: var(--accent); }
  button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    padding: 4px 10px; font: inherit; cursor: pointer; white-space: nowrap;
  }
  button:hover { border-color: var(--muted); }
  button.on { background: var(--accent2); border-color: var(--accent); }
  button.primary { background: var(--accent2); border-color: var(--accent); }
  button:disabled { opacity: 0.45; cursor: default; }
  .btns { display: flex; gap: 4px; flex-wrap: wrap; margin: 6px 0; }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; margin-left: -1px; }
  .seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 6px 6px 0; }
  #layerActs .row > label:first-child { width: 64px; }
  .tag { font-size: 11px; color: var(--muted); }
  #objList { margin: 6px 0; }
  .obj { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
  .obj .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .obj span { flex: 1; color: var(--muted); }
  .obj button { padding: 0 6px; }
  canvas.chart { width: 100%; height: 130px; display: block; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
  canvas.square { height: 230px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 2px 4px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; }
  td.bad { color: var(--bad); } td.good { color: var(--good); }
  .warnlist { margin: 4px 0 0; padding-left: 16px; color: var(--warn); font-size: 12px; }
  .note { color: var(--muted); font-size: 12px; margin: 4px 0; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; margin: 6px 0; }
  .kv span:nth-child(odd) { color: var(--muted); }
  .hidden { display: none !important; }
  #tip {
    position: fixed; z-index: 10; max-width: 280px; padding: 6px 9px; border-radius: 6px; pointer-events: none;
    background: #2d333b; border: 1px solid var(--line); color: var(--text); font-size: 12px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
  }
  [data-tip] { cursor: help; }
  button[data-tip], input[data-tip], select[data-tip] { cursor: pointer; }
  a { color: var(--accent); }

  @media (max-width: 1250px) {
    #app { grid-template-columns: 290px minmax(0, 1fr); height: auto; }
    main { height: calc(100vh - 47px); min-height: 520px; }
    #controls { max-height: calc(100vh - 47px); }
    #analysis { grid-column: 1 / -1; border-left: none; border-top: 1px solid var(--line);
      display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 0 18px; }
    #analysis h2:first-child { border-top: 1px solid var(--line); padding-top: 10px; }
  }
  @media (max-width: 760px) {
    #app { grid-template-columns: 1fr; }
    main { height: 72vh; order: -1; }
    #stageLabel { top: auto; bottom: 30px; }
    #controls { max-height: none; border-right: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Neural Space Deformation</h1>
  <span class="seg" data-tip="Dimension of the input and output space. 3D uses Three.js; objects are cleared when switching.">
    <button id="dim2" class="on">2D</button><button id="dim3">3D</button>
  </span>
  <span class="spacer"></span>
  <button id="recommendBtn" class="primary" data-tip="Apply settings that work well for the current task and data (layers, width, activations, init, optimiser) and fit the view. Nothing else changes your settings automatically.">★ Recommended</button>
  <button id="exportBtn" data-tip="Download the full setup (architecture, seed, weights, objects, pins, settings) as JSON.">Export JSON</button>
  <button id="importBtn" data-tip="Load a setup exported with “Export JSON”.">Import JSON</button>
  <input id="importFile" type="file" accept="application/json,.json" class="hidden">
  <a href="https://github.com/writerforight/mlp-space-deformation" target="_blank" rel="noopener">GitHub</a>
</header>

<div id="app">
  <!-- ======================= left: controls ======================= -->
  <aside id="controls">
    <h2>Network</h2>
    <div class="row"><label data-tip="Number of layers; each layer is a linear map followed by an activation.">Layers</label>
      <input id="layers" type="range" min="1" max="8" step="1"><span class="val" id="layersVal"></span></div>
    <div class="row"><label data-tip="Width of the hidden layers. With width = input dimension every layer can be drawn directly; wider layers are shown through a PCA projection.">Hidden width</label>
      <input id="width" type="range" min="1" max="16" step="1"><span class="val" id="widthVal"></span></div>
    <div class="row"><label data-tip="Activation used by every layer when temperature is 0 (unless a layer is set manually below).">Default act.</label>
      <select id="defaultAct"></select></div>
    <div class="row"><label data-tip="0: every layer uses the default activation. 1: each layer picks uniformly at random from the list (fixed by the seed).">Temperature</label>
      <input id="temperature" type="range" min="0" max="1" step="0.05"><span class="val" id="temperatureVal"></span></div>
    <div class="checks" style="grid-template-columns:1fr">
      <label data-tip="Make the last layer linear (identity activation) — usually what you want when training regression or classification outputs."><input id="outputLinear" type="checkbox"> Linear output layer</label>
    </div>
    <div id="layerActs"></div>
    <div class="row"><label data-tip="Distribution of the random initial weights. Xavier/He scale the spread by the layer sizes.">Init</label>
      <select id="initDist"><option value="normal">normal</option><option value="uniform">uniform</option><option value="xavier">Xavier</option><option value="he">He</option></select></div>
    <div class="row"><label data-tip="Multiplies the spread of the initial weights: small = gentle maps, large = strong stretching and folding.">Init scale</label>
      <input id="initScale" type="range" min="0.1" max="3" step="0.05"><span class="val" id="initScaleVal"></span></div>
    <div class="row"><label data-tip="Random seed: the same seed always gives the same weights and the same random activations.">Seed</label>
      <input id="seed" type="number" min="0" step="1"><button id="resample" data-tip="Draw new random weights (next seed).">Resample</button></div>

    <h2>Objects</h2>
    <div class="note" id="toolNote"></div>
    <div class="row"><label data-tip="Each drawn object is resampled to this many points, connected in order so stretching and folding stay visible.">Points</label>
      <input id="nPoints" type="range" min="200" max="500" step="10"><span class="val" id="nPointsVal"></span></div>
    <div id="sphereControls" class="hidden">
      <div class="row"><label data-tip="Centre and radius of the sphere to add or to draw on.">Sphere</label>
        <input id="sx" type="number" step="0.1" value="0"><input id="sy" type="number" step="0.1" value="0"><input id="sz" type="number" step="0.1" value="0"></div>
      <div class="row"><label>Radius</label><input id="sr" type="number" step="0.1" min="0.05" value="0.6">
        <button id="addSphere" data-tip="Add a sphere sampled with the Fibonacci spiral, points connected in spiral order.">Add sphere</button></div>
    </div>
    <div id="objList"></div>
    <div id="pinList"></div>
    <div class="btns"><button id="clearObjects" data-tip="Remove all drawn objects (curves, circles, regions, spheres). Pins stay.">Clear objects</button>
      <button id="clearPins" data-tip="Remove all pinned points.">Clear pins</button>
      <button id="examples" data-tip="Add a few example objects.">Add examples</button></div>

    <h2>Display</h2>
    <div class="checks">
      <label data-tip="Square grid of the input space, pushed through the network."><input id="showGrid" type="checkbox"> Grid</label>
      <label data-tip="Unit circle (2D) or unit sphere (3D)."><input id="showCircle" type="checkbox"> Unit circle</label>
      <label data-tip="Basis vectors e1, e2 (e3) as segments from the origin."><input id="showBasis" type="checkbox"> Basis vectors</label>
      <label data-tip="Where the origin goes."><input id="showOrigin" type="checkbox"> Origin</label>
      <label data-tip="Image of a small circle under the local Jacobian: shows local stretching, squashing and rotation."><input id="showJac" type="checkbox"> Jacobian ellipses</label>
      <label data-tip="Colour by the sign of det(J): green keeps orientation, red is mirrored (a fold), grey is collapsed."><input id="showDet" type="checkbox"> det(J) sign</label>
      <label data-tip="Colour each point by how far it has moved from its input position."><input id="showDist" type="checkbox"> Distance moved</label>
      <label data-tip="Keep the camera zoomed to the current shapes (hides pure scaling, shows shape)."><input id="autoFit" type="checkbox"> Auto-fit view</label>
    </div>
    <div class="btns"><button id="fitBtn" data-tip="Zoom to fit the current shapes.">Fit view</button>
      <button id="resetView" data-tip="Back to the default zoom.">Reset view</button></div>

    <h2>Training</h2>
    <div class="row"><label data-tip="What the network is trained to do.">Task</label>
      <select id="target">
        <option value="none">none (just look)</option>
        <option value="anchors">send each class to a point</option>
        <option value="classify">separate classes (logits)</option>
        <option value="transform">match a linear map</option>
        <option value="pins">pinned points</option>
      </select></div>
    <div class="row" id="datasetRow"><label data-tip="Two-class dataset: blue is class 1, red is class 2.">Data</label>
      <select id="dataset"><option value="moons">two moons</option><option value="circles">circles</option><option value="spirals">spirals</option></select></div>
    <div class="row" id="transformRow"><label data-tip="The linear map A the network should learn: x ↦ A·x.">Map</label>
      <select id="transform"><option value="rotation">rotation</option><option value="shear">shear</option><option value="scaling">scaling</option></select></div>
    <div class="row" id="amountRow"><label data-tip="Angle (rotation, radians), shear factor, or scale factor of the target transform.">Amount</label>
      <input id="amount" type="range" min="-3" max="3" step="0.05"><span class="val" id="amountVal"></span></div>
    <div class="note" id="targetNote"></div>
    <div class="row"><label data-tip="SGD: θ ← θ − lr·g.  Adam: per-parameter steps from running averages of g and g².">Optimizer</label>
      <select id="optimizer"><option value="adam">Adam</option><option value="sgd">SGD</option></select></div>
    <div class="row"><label data-tip="Step size (log scale).">Learning rate</label>
      <input id="lr" type="range" min="-4" max="0" step="0.05"><span class="val" id="lrVal"></span></div>
    <div class="row"><label data-tip="Samples per gradient step.">Batch size</label>
      <input id="batch" type="range" min="1" max="128" step="1"><span class="val" id="batchVal"></span></div>
    <div class="row"><label data-tip="Optimisation steps per animation frame.">Steps/frame</label>
      <input id="stepsPerFrame" type="range" min="1" max="50" step="1"><span class="val" id="stepsPerFrameVal"></span></div>
    <div class="row"><label data-tip="Re-draw the deformed objects every N steps (smaller = smoother, slower).">Redraw every</label>
      <input id="redrawEvery" type="range" min="1" max="200" step="1"><span class="val" id="redrawEveryVal"></span></div>
    <div class="row"><label data-tip="Joint: one loss over all targets. Sequential: train on one target (pin / chunk of data) at a time, like continual learning.">Mode</label>
      <span class="seg"><button id="modeJoint">joint</button><button id="modeSeq">sequential</button></span></div>
    <div class="row seqOnly"><label data-tip="Steps spent on each task before moving to the next one.">Steps/task</label>
      <input id="stepsPerTask" type="range" min="20" max="2000" step="10"><span class="val" id="stepsPerTaskVal"></span></div>
    <div class="row seqOnly"><label data-tip="Dataset / transform targets are split into this many chunks (tasks) in sequential mode; pins are one task each.">Tasks</label>
      <input id="nTasks" type="range" min="2" max="8" step="1"><span class="val" id="nTasksVal"></span></div>
    <div class="row seqOnly"><label data-tip="Replay: mix stored old samples into new batches. OGD: project gradients orthogonal to old output gradients. EWC: penalise moving weights that mattered (Fisher).">Anti-forgetting</label>
      <select id="method"><option value="none">none</option><option value="replay">replay buffer</option><option value="ogd">orthogonal gradient projection</option><option value="ewc">EWC penalty</option></select></div>
    <div class="row seqOnly" id="lambdaRow"><label data-tip="Strength λ of the EWC penalty λ/2 Σ F_i (θ_i − θ*_i)² (log scale).">EWC λ</label>
      <input id="lambda" type="range" min="0" max="4" step="0.05"><span class="val" id="lambdaVal"></span></div>
    <div class="btns">
      <button id="trainPlay" class="primary">▶ Train</button><button id="trainStep" data-tip="One optimisation step.">Step</button>
      <button id="trainReset" data-tip="Re-initialise the weights (same seed) and clear the training history.">Reset</button>
    </div>
    <div class="note" id="trainStatus"></div>
  </aside>

  <!-- ======================= centre: the view ======================= -->
  <main>
    <div id="view">
      <canvas id="c2d"></canvas>
      <div id="c3d" class="hidden"></div>
      <div id="toolbar"></div>
      <div id="stageLabel"></div>
      <div id="legend" class="hidden"></div>
      <div id="hint"></div>
    </div>
    <div id="stagebar">
      <button id="play" data-tip="Animate through the layers.">▶</button>
      <button id="stepBack" data-tip="Previous sub-step.">⏮</button>
      <button id="stepFwd" data-tip="Next sub-step (linear, then activation).">⏭</button>
      <input id="stage" type="range" min="0" max="1" step="0.001" data-tip="Show the objects after layer k: each layer is split into the linear step and the activation step.">
      <span id="ticks"></span>
    </div>
  </main>

  <!-- ======================= right: analysis ======================= -->
  <aside id="analysis">
    <section>
      <h2>Loss</h2>
      <canvas id="lossChart" class="chart"></canvas>
      <div class="note" id="lossNote"></div>
    </section>
    <section>
      <h2>Forgetting</h2>
      <div class="note" data-tip="F_A = L_A(after training on later tasks) − L_A(right after training on A). Positive = forgotten.">F<sub>A</sub> = L<sub>A</sub>(after later tasks) − L<sub>A</sub>(after A)</div>
      <div id="forgetting"></div>
    </section>
    <section>
      <h2>Interference</h2>
      <div class="row"><label data-tip="Cosine of per-point loss gradients (+1: training on one helps the other, −1: they fight). NTK: K(xi, xj) = trace(J_i J_jᵀ), J = ∂f/∂θ.">Matrix</label>
        <select id="matrixKind"><option value="cosine">gradient cosine</option><option value="ntk">NTK trace</option></select></div>
      <canvas id="heatmap" class="chart square"></canvas>
      <div class="note" id="heatNote"></div>
    </section>
    <section>
      <h2>Input sensitivity</h2>
      <div class="row"><label data-tip="Size of the input perturbation used for the finite-difference curve.">ε</label>
        <input id="eps" type="range" min="-3" max="0" step="0.05"><span class="val" id="epsVal"></span></div>
      <canvas id="sensChart" class="chart"></canvas>
      <div class="kv" id="sensInfo"></div>
    </section>
    <section>
      <h2>Invertibility</h2>
      <div id="layerTable"></div>
    </section>
  </aside>
</div>
<div id="tip" class="hidden"></div>

<!-- Three.js (classic build) for the 3D view; everything else is plain JavaScript in src/. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="src/nn.js"></script>
<script src="src/viz2d.js"></script>
<script src="src/viz3d.js"></script>
<script src="src/ui.js"></script>
</body>
</html>
